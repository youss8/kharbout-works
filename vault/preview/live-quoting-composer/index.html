  from: '2026-12-23', through: '2026-12-28', part: 'Full', available: 120, submitted: false,
  price: function price(from, through, part) {
  const first = Date.parse(from + 'T00:00:00Z');
  const last = Date.parse(through + 'T00:00:00Z');
  const days = [];
  if (!Number.isFinite(first) || !Number.isFinite(last) || last < first || last - first > 365 * 86400000) return days;
  for (let t = first; t <= last; t += 86400000) {
    const date = new Date(t);
    const iso = date.toISOString().slice(0, 10);
    const holiday = ['2026-12-25', '2027-01-01'].includes(iso);
    const weekend = [5, 6].includes(date.getUTCDay());
    days.push({ date: iso, label: holiday ? 'Holiday excluded' : weekend ? 'Weekend excluded' : 'Working',
      hours: holiday || weekend ? 0 : part === 'Full' ? 8 : 4 });
  }
  return days;
},
  get days() { return this.price(this.from, this.through, this.part) },
  get total() { return this.days.reduce((sum, d) => sum + d.hours, 0) },
  get overlap() { return this.from <= '2026-12-30' &amp;&amp; this.through >= '2026-12-28' &amp;&amp; this.days.length > 0 },
  get valid() { return this.total > 0 &amp;&amp; this.total <= this.available &amp;&amp; !this.submitted },
  submit() { if (this.valid) { this.available -= this.total; this.submitted = true } }
}" @submit.prevent="submit()">
  <div class="grid gap-2 sm:grid-cols-3">
    <label class="grid min-w-0 gap-1 font-semibold">From<input class="w-full min-w-0 rounded-sm border bg-transparent p-2 font-normal" type="date" x-model="from" @input="submitted = false"></label>
    <label class="grid min-w-0 gap-1 font-semibold">Through<input class="w-full min-w-0 rounded-sm border bg-transparent p-2 font-normal" type="date" x-model="through" @input="submitted = false"></label>
    <label class="grid min-w-0 gap-1 font-semibold">Part of day<select class="w-full min-w-0 rounded-sm border bg-transparent p-2 font-normal" x-model="part" @change="submitted = false"><option>Full</option><option>AM</option><option>PM</option></select></label>
  </div>
  <div class="max-h-56 overflow-auto"><table class="w-full"><thead><tr><th class="border-b px-1 py-1.5 text-start">Date</th><th class="border-b px-1 py-1.5 text-start">Price basis</th><th class="border-b px-1 py-1.5 text-start">Hours</th></tr></thead>
    <tbody><template x-for="d in days" :key="d.date"><tr><td class="border-b px-1 py-1.5 text-start" x-text="d.date"></td><td class="border-b px-1 py-1.5 text-start">
      <span class="inline-flex items-center gap-1 rounded-sm border px-1.5 py-0.5 text-xs" :class="d.hours ? 'border-solid bg-emerald-100 text-emerald-950' : 'border-dashed'"><span aria-hidden="true" x-text="d.hours ? '✓' : '−'"></span><span x-text="d.label"></span></span>
    </td><td class="border-b px-1 py-1.5 text-start" x-text="d.hours"></td></tr></template></tbody>
  </table></div>
  <p x-show="overlap">Team overlap · Jordan Okafor is on leave December 28–30.</p>
  <output x-text="total + 'h quoted · ' + available + 'h available'"></output>
  <p x-show="!total">Select a working date range of up to one year.</p>
  <p x-show="total > available && !submitted">Insufficient balance.</p>
  <button type="submit" class="w-fit rounded-sm border px-3 py-2 font-semibold disabled:opacity-50" :disabled="!valid">Reserve hours</button>
  <p role="status" x-show="submitted" x-text="total + 'h reserved.'"></p>
</form></template> <script>
