</style><script type="module" src="/youssef-operations-kit/_astro/page.BcS3FZsa.js"></script></head><body class="example-body"> <main aria-label="Config-Driven Generic Register"> <p class="preview-origin type-meta">Observed + Clean-Room [spec]</p> <template id="alpine-example"><section aria-label="Endpoint register" class="grid gap-3 p-3 text-start text-sm" x-data="{
  fields: [
    { key: 'name', label: 'Endpoint', required: true },
    { key: 'branch', label: 'Branch', required: false },
    { key: 'type', label: 'Type', required: false }
  ], rows: [
    { id: 1, name: 'NH-WS-014', branch: 'North Hub', type: 'Workstation' },
    { id: 2, name: 'HO-LT-007', branch: 'Harbor Office', type: 'Laptop' }
  ], search: '', editingId: null, form: {}, history: [], historyId: null, notice: '',
  get visible() {
    const term = this.search.trim().toLowerCase()
    return this.rows.filter(row => this.fields.some(field => String(row[field.key] ?? '').toLowerCase().includes(term)))
  },
  edit(row) {
    this.editingId = row?.id ?? null
    this.form = Object.fromEntries(this.fields.map(field => [field.key, row?.[field.key] ?? '']))
    this.$refs.editor.showModal()
  },
  cleanForWrite(form) {
    return Object.fromEntries(this.fields.map(field => [field.key, String(form[field.key] ?? '').trim() || null]))
  },
  save() {
    const clean = this.cleanForWrite(this.form)
    if (this.fields.some(field => field.required &amp;&amp; !clean[field.key])) {
      this.notice = 'Enter the required endpoint name.'
      return
    }
    const previous = this.rows.find(row => row.id === this.editingId)
    const id = previous?.id ?? Math.max(0, ...this.rows.map(row => row.id)) + 1
    const updated = {id, ...clean}
    const diffs = this.fields.filter(field => (previous?.[field.key] ?? null) !== clean[field.key])
      .map(field => ({ label: field.label, before: previous?.[field.key] ?? null, after: clean[field.key] }))
    this.rows = previous ? this.rows.map(row => row.id === id ? updated : row) : [...this.rows, updated]
    if (diffs.length) this.history.push({ id, version: this.history.filter(change => change.id === id).length + 1, diffs })
    this.notice = diffs.length ? 'Saved ' + clean.name + '.' : 'No fields changed.'
    this.$refs.editor.close()
  },
  inspect(id) { this.historyId = id; this.$refs.audit.showModal() },
  get changes() { return this.history.filter(change => change.id === this.historyId).slice().reverse() },
  exportCsv() {
    function toCsvCell(value) {
  const text = String(value ?? '');
  const safe = /^[\s]*[=+@\x2D]/.test(text) ? &quot;'&quot; + text : text;
  return '&quot;' + safe.replaceAll('&quot;', '&quot;&quot;') + '&quot;';
}
    const fields = this.fields, visible = this.visible
    const lines = [fields.map(field => field.label), ...visible.map(row => fields.map(field => row[field.key]))];
  const csv = lines.map(line => line.map(toCsvCell).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob(['\uFEFF', csv], { type: 'text/csv;charset=utf-8' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = 'endpoint-register.csv';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
}">
  <label class="grid gap-1">Search register<input type="search" class="min-w-0 rounded-sm border border-strong bg-surface p-2 text-ink" x-model="search"></label>
  <div class="flex flex-wrap items-center gap-2"><button type="button" class="rounded-sm border border-strong bg-surface px-3 py-2 text-ink hover:bg-subtle" @click="edit(null)">Create record</button>
    <button type="button" class="rounded-sm border border-strong bg-surface px-3 py-2 text-ink hover:bg-subtle" @click="exportCsv()">Export CSV</button></div>
  <table class="w-full table-fixed text-xs"><thead><tr>
    <template x-for="field in fields" :key="field.key"><th scope="col" class="break-words border-b border-hairline p-1 text-start align-top [overflow-wrap:anywhere]" x-text="field.label"></th></template>
    <th scope="col" class="break-words border-b border-hairline p-1 text-start align-top [overflow-wrap:anywhere]">Actions</th></tr></thead><tbody>
    <template x-for="row in visible" :key="row.id"><tr>
      <template x-for="field in fields" :key="field.key"><td class="break-words border-b border-hairline p-1 text-start align-top [overflow-wrap:anywhere]" x-text="row[field.key] ?? '—'"></td></template>
      <td class="break-words border-b border-hairline p-1 text-start align-top [overflow-wrap:anywhere]"><button type="button" class="block text-accent underline" @click="edit(row)" :aria-label="'Edit ' + row.name">Edit</button>
        <button type="button" class="block text-accent underline" @click="inspect(row.id)" :aria-label="'History for ' + row.name">History</button></td>
    </tr></template></tbody></table>
  <p x-show="!visible.length">No matching records.</p>
  <dialog x-ref="editor" class="m-auto w-[min(25rem,calc(100%-2rem))] max-w-full rounded-sm border border-strong bg-surface p-3 text-ink backdrop:bg-black/40" aria-label="Record editor" @click.self="$el.close()">
    <form class="grid gap-2" @submit.prevent="save()"><h3 x-text="editingId ? 'Edit record' : 'Create record'"></h3>
      <template x-for="field in fields" :key="field.key"><label class="grid gap-1"><span x-text="field.label"></span>
        <input class="min-w-0 rounded-sm border border-strong bg-surface p-2 text-ink" x-model="form[field.key]" :required="field.required" maxlength="120"></label></template>
      <div class="flex flex-wrap items-center gap-2"><button class="rounded-sm border border-strong bg-surface px-3 py-2 text-ink hover:bg-subtle">Save record</button><button type="button" class="rounded-sm border border-strong bg-surface px-3 py-2 text-ink hover:bg-subtle" @click="$refs.editor.close()">Cancel</button></div>
    </form></dialog>
  <dialog x-ref="audit" class="fixed inset-y-0 m-0 ms-auto h-full max-h-full w-[min(22rem,100%)] border-s border-strong bg-surface p-3 text-ink backdrop:bg-black/40" aria-label="Field history" @click.self="$el.close()">
    <h3>Field history</h3><p x-show="!changes.length">No changes recorded in this session.</p>
    <template x-for="change in changes" :key="change.version"><section class="my-2"><h4 x-text="'Revision ' + change.version"></h4>
      <dl><template x-for="diff in change.diffs" :key="diff.label"><div class="py-1"><dt x-text="diff.label"></dt>
        <dd><del x-text="diff.before ?? 'null'"></del> → <ins x-text="diff.after ?? 'null'"></ins></dd></div></template></dl>
    </section></template><button type="button" class="rounded-sm border border-strong bg-surface px-3 py-2 text-ink hover:bg-subtle" @click="$refs.audit.close()">Close history</button></dialog>
  <p role="status" class="min-h-5 text-xs text-accent" x-text="notice"></p>
