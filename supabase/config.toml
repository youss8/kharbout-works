project_id = "kharbout-prompt-builder"

[auth]
site_url = "http://localhost:4321"
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Your Kharbout Works sign-in code"
content_path = "./supabase/templates/prompt-sign-in.html"

[auth.email.template.confirmation]
subject = "Your Kharbout Works sign-in code"
content_path = "./supabase/templates/prompt-sign-in.html"

[functions.prompt-ai]
verify_jwt = true

[functions.prompt-account]
verify_jwt = true
