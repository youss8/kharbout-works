name: Catalogue checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, dom, xml, curl, phar
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
        env:
          VAULT_FORBIDDEN_TERMS: ${{ secrets.VAULT_FORBIDDEN_TERMS }}
      - run: npx astro check
      - run: npm run build
      - run: npm run build:catalogue
      - run: vendor/bin/pint --test
      - run: composer analyse
      - run: composer test
      - run: npm run test:kit
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run test:workbench
      - name: Exercise the Vault examples on Laravel 13 and Livewire 4
        run: |
          mkdir -p test-results/livewire-runtime
          composer --working-dir=test-results/livewire-runtime require 'laravel/framework:13.*' 'livewire/livewire:4.*' --no-interaction --prefer-dist
          php tests/workbench/verify-livewire.php
          php tests/workbench/verify-tier4-contracts.php
          npx playwright test --config tests/workbench/livewire.playwright.config.mjs
      - run: npm run test:browser

  docker-smoke:
    name: Docker catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: docker compose config --quiet
      - run: docker compose up --build --detach
      - name: Verify the catalogue, source download and standalone build
        run: |
          curl --retry 20 --retry-all-errors --retry-delay 1 --fail --silent --show-error http://127.0.0.1:8080/ -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/entries/copy-code -o "$RUNNER_TEMP/catalogue-entry.html"
          grep --quiet --fixed-strings 'copy-code' "$RUNNER_TEMP/catalogue-entry.html"
          curl --fail --silent --show-error http://127.0.0.1:8080/entries/search-dialog/download -o "$RUNNER_TEMP/search-dialog.zip"
          unzip -t "$RUNNER_TEMP/search-dialog.zip"
          unzip -q "$RUNNER_TEMP/search-dialog.zip" -d "$RUNNER_TEMP/dialog-example"
          npm ci --prefix "$RUNNER_TEMP/dialog-example"
          npm run build --prefix "$RUNNER_TEMP/dialog-example"
          curl --fail --silent --show-error 'http://127.0.0.1:8080/examples/catalogue-search?q=keyboard' | jq -e '.count == 1 and .data[0].title == "Keyboard shortcut label"'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
