<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Reading list</title>
        <style>
            body {
                max-width: 40rem;
                margin: 12vh auto;
                padding-inline: 1rem;
                color: #173628;
                background: #faf9f5;
                font:
                    1rem/1.5 system-ui,
                    sans-serif;
            }
            #reading-list > .recipe-demo {
                display: grid;
                justify-items: start;
                gap: 0.75rem;
            }
            .recipe-demo button {
                padding: 0.6rem 0.9rem;
                border: 0;
                border-radius: 0.35rem;
                background: #143b2b;
                color: white;
                font: inherit;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Reading list</h1>
            <p>Search by title or description. Press Ctrl+K or ⌘K to open the list.</p>
            <div id="reading-list"></div>
        </main>
        <script type="module" src="./main.tsx"></script>
    </body>
</html>
